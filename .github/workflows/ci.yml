name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

env:
  IMAGE_NAME: traffic-light-detect

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check src scripts tests

      - name: Type check
        run: mypy src --ignore-missing-imports

      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real sample images
        run: |
          python -m pip install requests
          python scripts/fetch_samples.py

      - name: Build image
        run: docker build -f docker/Dockerfile --target infer -t ${{ env.IMAGE_NAME }}:ci .

      - name: Smoke inference in container
        run: |
          mkdir -p outputs
          docker run --rm \
            -v "$PWD/samples:/app/samples:ro" \
            -v "$PWD/outputs:/app/outputs" \
            ${{ env.IMAGE_NAME }}:ci \
            scripts/infer.py --weights yolov8n.pt --source samples --no-show --save outputs/ci_smoke

  publish:
    if: github.event_name == 'release'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          TAG=${GITHUB_REF_NAME}
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          docker build -f docker/Dockerfile --target infer -t ${IMAGE}:${TAG} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${TAG}
          docker push ${IMAGE}:latest
